# 5. Pump control:
suite:
- ident: PUMP_CNTRL
  steps:
  - command: power 5V on
    title: "Power to PWM MCU enabled !"
  - command: sleepms 500
  - command: power VARV 16
    title: "Power to pump enabled"
  - command: sleepms 500
  - command: pin DDTP10 output high
    title: "PUMP ON !"
  - command: sleepms 10000
  - command: pin DDTP10 output low
    title: "PUMP OFF !"